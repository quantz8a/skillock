[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillock"
version = "0.1.0"
description = "Hana — lockfile checks for agent skills. Pure Python, no platform build."
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
skillock = "skillock.cli:main"

[tool.setuptools.packages.find]
include = ["skillock*"]
